services:
  chatwoot-spec:
    image: corporate-chatwoot-ce:specs
    build:
      context: .
      dockerfile: infra/chatwoot-corporate/Dockerfile
      target: test
      args:
        CHATWOOT_CE_IMAGE: ${CHATWOOT_CE_IMAGE}
        NODE_IMAGE: ${NODE_IMAGE}
    environment:
      RAILS_ENV: test
      DISABLE_ENTERPRISE: 'true'
      CORPORATE_ACCESS_ENABLED: 'true'
      SECRET_KEY_BASE: ${SECRET_KEY_BASE}
      ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY: ${ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY}
      ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY: ${ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY}
      ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT: ${ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT}
      POSTGRES_HOST: postgres
      POSTGRES_DATABASE: chatwoot_spec
      POSTGRES_USERNAME: chatwoot
      POSTGRES_PASSWORD: ${CW_DATABASE_PASSWORD}
      REDIS_URL: redis://redis:6379/10
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      FRONTEND_URL: http://localhost:8080
    command: ['bundle', 'exec', 'rspec', 'spec/corporate']
    networks: [lab]
